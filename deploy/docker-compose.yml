# Production stack for the VPS. Lives at /opt/suwapath/docker-compose.yml.
#
# This box already runs nginx + certbot fronting three other apps
# (agentkap, auditra, faceid), each as its own vhost in
# /etc/nginx/sites-available. SuwaPath follows the same convention instead
# of introducing a second reverse proxy that would fight nginx for
# ports 80/443: the backend publishes only to 127.0.0.1:8020, and the
# suwapath.pasidumihiranga.me nginx vhost (set up once, outside of this
# compose file) proxies /api, /docs, /health etc. there and serves
# ./frontend/dist directly for everything else, with TLS from certbot.
#
# /opt/suwapath/.env holds POSTGRES_*, DATABASE_URL, JWT_SECRET,
# SUWAPATH_ENCRYPTION_KEY etc. It is written once during provisioning and is
# never touched by CI or committed to git.
#
# backend_storage is a bind mount, not a named volume: Docker creates named
# volumes root-owned, and the backend runs as uid 1000 (see Dockerfile) —
# writing to a root-owned directory fails on first boot. /opt/suwapath/data
# is chown'd to 1000:1000 once during provisioning.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.1
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    image: ghcr.io/pasidu-mihiranga/suwapath-api:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8020:7860"
    volumes:
      - ./data:/home/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  pgdata:
  qdrant_storage:
