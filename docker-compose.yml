# Optional container setup. The default local workflow uses Homebrew
# PostgreSQL and an embedded on-disk Qdrant, so this file is only needed if you
# prefer containers or are deploying somewhere other than a dev machine.
#
#   docker compose up -d
#   # then set in .env:
#   #   DATABASE_URL=postgresql+psycopg2://suwapath:suwapath@127.0.0.1:5432/suwapath
#   #   QDRANT_URL=http://127.0.0.1:6333

services:
  postgres:
    image: postgres:16-alpine
    container_name: suwapath-postgres
    environment:
      POSTGRES_USER: suwapath
      POSTGRES_PASSWORD: suwapath
      POSTGRES_DB: suwapath
    ports:
      - "5432:5432"
    volumes:
      - suwapath-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suwapath -d suwapath"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: suwapath-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - suwapath-qdrant:/qdrant/storage

volumes:
  suwapath-pgdata:
  suwapath-qdrant:
