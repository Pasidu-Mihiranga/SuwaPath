<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0090b0" />
    <meta name="description" content="SuwaPath — AI patient navigation, clinical intake and hospital intelligence for Sri Lanka." />
    <!-- Typography. Google Sans for headings, Nunito Sans for body copy,
         JetBrains Mono for clinical numbers. Every face named in tokens.css
         must be requested here — one declared but not fetched falls through
         to the system font silently, which has happened before.
         `display=swap` shows system text immediately and swaps when the
         webfont arrives, so a slow connection never blanks the interface. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Nunito+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>SuwaPath — Your Health. Our Path.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
