name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase: GHCR rejects uppercase in image refs, and
  # github.repository_owner ("Pasidu-Mihiranga") has capitals.
  IMAGE_NAME: pasidu-mihiranga/suwapath-api
  # Release holding the converted .onnx weights. Publish with:
  #   gh release create models-v1 models/pneumonia/*.onnx --title "Model weights v1"
  # Bump the tag to roll models forward; the image rebuilds against the new one.
  MODEL_RELEASE_TAG: models-v1

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Model weights live on a GitHub Release, not in git.
      #
      # Three ~94 MB ONNX files are too large to commit and too small to
      # justify object storage. A release asset is versioned, free, and needs
      # no infrastructure. `COPY models` in the Dockerfile then bakes whatever
      # is present into the image.
      #
      # Deliberately not a hard failure. If the release is missing the build
      # still succeeds and the API falls back to its untrained baseline
      # adapter, which is the documented behaviour for a deployment with no
      # weights. A broken deploy would be a worse outcome than a degraded one,
      # and `GET /api/v1/vision/adapters` reports which is running.
      - name: Fetch model weights from the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          mkdir -p models/pneumonia
          if gh release download "$MODEL_RELEASE_TAG" \
               --repo "${{ github.repository }}" \
               --pattern '*.onnx' --dir models/pneumonia --clobber; then
            echo "Fetched weights from $MODEL_RELEASE_TAG:"
            ls -lh models/pneumonia/*.onnx
          else
            echo "::warning::No '$MODEL_RELEASE_TAG' release found. The image "\
                 "will ship without trained weights and use the baseline adapter."
          fi

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        env:
          # Empty base + same-origin Caddy routing = no CORS in production.
          VITE_API_BASE: ""
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Sync compose file and frontend build to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy,frontend-dist"
          target: /opt/suwapath
          strip_components: 0

      - name: Deploy on the VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/suwapath
            mv deploy/docker-compose.yml docker-compose.yml
            rm -rf frontend/dist
            mkdir -p frontend
            mv frontend-dist frontend/dist
            rmdir deploy 2>/dev/null || true
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull backend

            # Postgres first, and wait for it. The migration and the backend
            # both need it, and `up -d` returning does not mean it is ready.
            docker compose up -d postgres
            for i in $(seq 1 30); do
              if docker compose exec -T postgres pg_isready -q; then break; fi
              sleep 2
            done

            # Schema migration, before the new backend serves a request.
            #
            # There is no shell access to this host, so this is the only place
            # it can run. It is idempotent and additive - it widens columns
            # that now hold ciphertext and adds the audit hash columns - so
            # running it on every deploy is safe and a no-op once applied.
            #
            # Run against the NEW image, not the running one: the migration
            # belongs to the code being deployed, and the old container does
            # not have it.
            docker compose run --rm --no-deps backend \
              python scripts/encrypt_phi_columns.py --apply

            docker compose up -d
            docker image prune -f
