name: Test & Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase: GHCR rejects uppercase in image refs
  IMAGE_NAME: pasidu-mihiranga/suwapath-api
  MODEL_RELEASE_TAG: models-v1

jobs:
  # ============================================================================
  # 1. TEST SUITE (Must pass 100% before any build or deployment proceeds)
  # ============================================================================
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        working-directory: backend
        env:
          ALLOW_RULE_BASED_FALLBACK: "true"
        run: |
          pytest tests/ -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Frontend Build
        working-directory: frontend
        run: |
          npm ci
          VITE_API_BASE="" npm run build

  # ============================================================================
  # 2. BUILD BACKEND DOCKER IMAGE
  # ============================================================================
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Fetch model weights from the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          mkdir -p models/pneumonia
          if gh release download "$MODEL_RELEASE_TAG" \
               --repo "${{ github.repository }}" \
               --pattern '*.onnx' --dir models/pneumonia --clobber; then
            echo "Fetched weights from $MODEL_RELEASE_TAG:"
            ls -lh models/pneumonia/*.onnx
          else
            echo "::warning::No '$MODEL_RELEASE_TAG' release found. The image will ship without trained weights."
          fi

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. BUILD FRONTEND SPA
  # ============================================================================
  build-frontend:
    name: Build Frontend SPA
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        env:
          VITE_API_BASE: ""
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # ============================================================================
  # 4. DEPLOY TO EC2 (Only if tests & builds succeed)
  # ============================================================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [test, build-backend, build-frontend]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Sync compose file and frontend build to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.EC2_SSH_USER || secrets.VPS_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.VPS_SSH_KEY }}
          source: "deploy,frontend-dist"
          target: /opt/suwapath
          strip_components: 0

      - name: Deploy and update environment on the server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || vars.PUBLIC_BASE_URL || 'https://suwapath.pasidumihiranga.me' }}
        with:
          host: ${{ secrets.EC2_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.EC2_SSH_USER || secrets.VPS_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.VPS_SSH_KEY }}
          envs: GROQ_API_KEY,GEMINI_API_KEY,OPEN_ROUTER_API_KEY,TAVILY_API_KEY,PUBLIC_BASE_URL
          script: |
            set -e
            cd /opt/suwapath

            # 1. Update API Keys in .env if provided in GitHub Secrets
            if [ -f /opt/suwapath/.env ]; then
              if [ -n "$GROQ_API_KEY" ]; then
                if grep -q "^GROQ_API_KEY=" /opt/suwapath/.env; then
                  sed -i "s|^GROQ_API_KEY=.*|GROQ_API_KEY=$GROQ_API_KEY|" /opt/suwapath/.env
                else
                  echo "GROQ_API_KEY=$GROQ_API_KEY" >> /opt/suwapath/.env
                fi
              fi

              if [ -n "$GEMINI_API_KEY" ]; then
                if grep -q "^GEMINI_API_KEY=" /opt/suwapath/.env; then
                  sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=$GEMINI_API_KEY|" /opt/suwapath/.env
                else
                  echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> /opt/suwapath/.env
                fi
              fi

              if [ -n "$OPEN_ROUTER_API_KEY" ]; then
                if grep -q "^OPEN_ROUTER_API_KEY=" /opt/suwapath/.env; then
                  sed -i "s|^OPEN_ROUTER_API_KEY=.*|OPEN_ROUTER_API_KEY=$OPEN_ROUTER_API_KEY|" /opt/suwapath/.env
                else
                  echo "OPEN_ROUTER_API_KEY=$OPEN_ROUTER_API_KEY" >> /opt/suwapath/.env
                fi
              fi

              if [ -n "$TAVILY_API_KEY" ]; then
                if grep -q "^TAVILY_API_KEY=" /opt/suwapath/.env; then
                  sed -i "s|^TAVILY_API_KEY=.*|TAVILY_API_KEY=$TAVILY_API_KEY|" /opt/suwapath/.env
                else
                  echo "TAVILY_API_KEY=$TAVILY_API_KEY" >> /opt/suwapath/.env
                fi
              fi

              if [ -n "$PUBLIC_BASE_URL" ]; then
                if grep -q "^PUBLIC_BASE_URL=" /opt/suwapath/.env; then
                  sed -i "s|^PUBLIC_BASE_URL=.*|PUBLIC_BASE_URL=$PUBLIC_BASE_URL|" /opt/suwapath/.env
                else
                  echo "PUBLIC_BASE_URL=$PUBLIC_BASE_URL" >> /opt/suwapath/.env
                fi
              fi
            fi

            # 2. Update Frontend static files & compose configuration
            if [ -f deploy/docker-compose.yml ]; then
              mv deploy/docker-compose.yml docker-compose.yml
            fi
            rm -rf deploy 2>/dev/null || true
            mkdir -p deploy
            ln -sf /opt/suwapath/docker-compose.yml /opt/suwapath/deploy/docker-compose.yml
            ln -sf /opt/suwapath/.env /opt/suwapath/deploy/.env

            rm -rf frontend/dist
            mkdir -p frontend
            mv frontend-dist frontend/dist

            # 3. Pull latest image from GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull backend

            # 4. Wait for Postgres
            docker compose up -d postgres
            for i in $(seq 1 30); do
              if docker compose exec -T postgres pg_isready -q; then break; fi
              sleep 2
            done

            # 5. Run idempotent database migrations
            docker compose run --rm --no-deps backend python scripts/migrate.py
            docker compose run --rm --no-deps backend python scripts/encrypt_phi_columns.py --apply

            # 6. Restart backend & prune old images
            docker compose up -d
            docker image prune -f
